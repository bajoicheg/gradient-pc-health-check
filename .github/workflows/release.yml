name: Publish GitHub Release

on:
  workflow_run:
    workflows: ["Windows EXE"]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: pc-health-check-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected release version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Skip if this version is already released
        id: exists
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$REPO" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.tag }} already exists; no assets will be replaced."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download tested EXE artifact
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          mkdir -p release-assets/final release-assets/pilot
          gh run download "$RUN_ID" --repo "$REPO" --name gradient-pc-health-check-windows-x64 --dir release-assets/final
          gh run download "$RUN_ID" --repo "$REPO" --name gradient-pc-health-check-pilot-e2e --dir release-assets/pilot

      - name: Verify release inputs
        if: steps.exists.outputs.exists == 'false'
        shell: pwsh
        run: |
          $exe = Get-Item release-assets/final/Gradient-PC-Health-Check.exe -ErrorAction Stop
          $checksum = Get-Item release-assets/final/Gradient-PC-Health-Check.exe.sha256 -ErrorAction Stop
          $pilot = Get-ChildItem release-assets/pilot -Filter 'Gradient-PC-Health-Check-*-pilot.zip' -File | Select-Object -First 1
          if ($null -eq $pilot) { throw 'Pilot E2E ZIP not found.' }

          $line = (Get-Content $checksum.FullName -Raw -Encoding ASCII).Trim()
          if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})\s+\*?Gradient-PC-Health-Check\.exe$') {
            throw 'Malformed checksum file.'
          }
          $actual = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches['hash'].ToLowerInvariant()) { throw 'EXE checksum mismatch before release.' }

          $fileVersion = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileVersion
          if (-not $fileVersion.StartsWith('${{ steps.version.outputs.version }}', [StringComparison]::Ordinal)) {
            throw "EXE FileVersion mismatch: $fileVersion"
          }
          Write-Host "Release input verified. SHA-256: $actual"

      - name: Publish GitHub Release
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          PILOT_ZIP=$(find release-assets/pilot -maxdepth 1 -type f -name 'Gradient-PC-Health-Check-*-pilot.zip' -print -quit)
          cat > release-notes.md <<'EOF'
          Gradient PC Health Check — Windows 11 Service Desk diagnostics and controlled remediation.

          Downloads:
          - `Gradient-PC-Health-Check.exe` — single-file self-contained Windows x64 application;
          - `Gradient-PC-Health-Check.exe.sha256` — checksum for the EXE;
          - `*-pilot.zip` — optional E2E kit and documentation for pilot verification.

          Administrative remediation is allowed only from the canonical protected path:
          `C:\Program Files\Gradient\PCHealthCheck\Gradient-PC-Health-Check.exe`.
          EOF

          gh release create "${{ steps.version.outputs.tag }}" \
            --repo "$REPO" \
            --target "$HEAD_SHA" \
            --title "Gradient PC Health Check ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            release-assets/final/Gradient-PC-Health-Check.exe \
            release-assets/final/Gradient-PC-Health-Check.exe.sha256 \
            "$PILOT_ZIP"
