name: Finalize 0.4.1 regression coverage

on:
  push:
    branches: [ feature/0.4.1-triage ]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Apply regression tests and docs
        shell: pwsh
        run: |
          python .github/scripts/finalize-041.py
          git diff --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/G.PcHealthCheck/G.PcHealthCheck.csproj
          dotnet build src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-restore -warnaserror

      - name: Product self-test
        shell: pwsh
        run: dotnet run --project src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-build -- --selftest

      - name: Commit finalized 0.4.1
        shell: pwsh
        run: |
          Remove-Item .github/scripts/finalize-041.py,.github/workflows/finalize-0.4.1.yml -Force
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: finalize 0.4.1 triage regressions and docs'
          git push origin HEAD:feature/0.4.1-triage
