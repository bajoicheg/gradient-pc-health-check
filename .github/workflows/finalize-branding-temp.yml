name: Finalize 0.3.5 branding

on:
  push:
    branches:
      - release/0.3.5
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: release/0.3.5
          persist-credentials: true
          fetch-depth: 1

      - name: Generate exact shield and green executable icon
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\tools\branding\Generate-BrandAssets.ps1

      - name: Switch header to embedded corporate shield
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src/Gradient.PcHealthCheck/MainForm.cs'
          $text = [IO.File]::ReadAllText($path)
          $old = "        var logo = new ShieldLogo { Location = new Point(13, 8), Size = new Size(58, 64), BackColor = Color.White };`n        p.Controls.Add(logo);"
          $newLines = @(
            '        var logo = new PictureBox',
            '        {',
            '            Location = new Point(13, 8),',
            '            Size = new Size(58, 64),',
            '            BackColor = Color.White,',
            '            SizeMode = PictureBoxSizeMode.Zoom,',
            '            Image = BrandAssets.LoadShield()',
            '        };',
            '        p.Controls.Add(logo);'
          )
          $new = $newLines -join "`n"
          if ($text.Contains($old)) {
            $text = $text.Replace($old, $new)
            [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))
          }
          elseif (-not $text.Contains('Image = BrandAssets.LoadShield()')) {
            throw 'Expected MainForm logo block not found.'
          }

      - name: Verify provenance and generated files
        shell: pwsh
        run: |
          $shield = 'src/Gradient.PcHealthCheck/assets/g-shield.png'
          $icon = 'src/Gradient.PcHealthCheck/assets/gpchc.ico'
          $preview = 'src/Gradient.PcHealthCheck/assets/gpchc-icon-green.png'
          $expected = '5157c5cf83a6cfddb74c51701a693e401e36b400812505a1e46e15d760c72877'
          $actual = (Get-FileHash $shield -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Corporate shield provenance check failed: $actual" }
          foreach ($file in @($icon, $preview)) {
            if (-not (Test-Path $file -PathType Leaf) -or (Get-Item $file).Length -lt 4096) {
              throw "Generated brand asset invalid: $file"
            }
          }
          if (-not (Select-String -LiteralPath src/Gradient.PcHealthCheck/MainForm.cs -SimpleMatch 'Image = BrandAssets.LoadShield()')) {
            throw 'MainForm does not use the embedded corporate shield.'
          }

      - name: Commit finalized assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/Gradient.PcHealthCheck/MainForm.cs src/Gradient.PcHealthCheck/assets/g-shield.png src/Gradient.PcHealthCheck/assets/gpchc.ico src/Gradient.PcHealthCheck/assets/gpchc-icon-green.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Branding already finalized.'
            exit 0
          }
          git commit -m 'Finalize exact G-switcher shield and green application icon'
          if ($LASTEXITCODE -ne 0) { throw 'Branding commit failed.' }
          git push origin HEAD:release/0.3.5
          if ($LASTEXITCODE -ne 0) { throw 'Branding push failed.' }
