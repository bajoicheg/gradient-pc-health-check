name: Prepare 0.4.0 product improvements

on:
  push:
    branches: [ feature/0.4.0-product ]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Apply product changes
        shell: pwsh
        run: python tools/ci/prepare_040.py

      - name: Validate source tree
        shell: pwsh
        run: |
          if (git grep -in -E 'gradient' -- ':!LICENSE') { throw 'Legacy brand token remains in tracked source.' }
          if (git grep -n 'Cursors.WaitCursor' -- src/G.PcHealthCheck) { throw 'Global WaitCursor remains in product source.' }
          if (-not (Test-Path src/G.PcHealthCheck/SupportSummary.cs)) { throw 'SupportSummary.cs missing.' }
          git diff --check

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/G.PcHealthCheck/G.PcHealthCheck.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-restore -warnaserror
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }

      - name: Product self-test
        shell: pwsh
        run: |
          dotnet run --project src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-build -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed: $LASTEXITCODE" }

      - name: Commit prepared 0.4.0
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '0.4.0 — improve Service Desk UX and fix busy cursor'
          git push origin HEAD:feature/0.4.0-product
