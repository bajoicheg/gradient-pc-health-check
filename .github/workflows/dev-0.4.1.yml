name: Prepare 0.4.1 triage

on:
  push:
    branches: [ feature/0.4.1-triage ]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Apply 0.4.1 changes
        shell: pwsh
        run: |
          python .github/scripts/apply-041.py
          python .github/scripts/patch-041.py
          git diff --check

      - name: Validate product source
        shell: pwsh
        run: |
          if (-not (Test-Path src/G.PcHealthCheck/TriageSummary.cs)) { throw 'TriageSummary.cs missing.' }
          if (Select-String -LiteralPath src/G.PcHealthCheck/G.PcHealthCheck.csproj -Pattern '<Version>0.4.1</Version>' -Quiet) { } else { throw 'Version 0.4.1 not set.' }
          if (Select-String -LiteralPath src/G.PcHealthCheck/SupportSummary.cs -Pattern 'string.Equals\(x.Drive, "C:",' -Quiet) { } else { throw 'Support summary system-drive lookup is not C:.' }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore src/G.PcHealthCheck/G.PcHealthCheck.csproj
          dotnet build src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-restore -warnaserror

      - name: Product self-test
        shell: pwsh
        run: dotnet run --project src/G.PcHealthCheck/G.PcHealthCheck.csproj -c Release --no-build -- --selftest

      - name: Commit prepared 0.4.1
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply-041.py,.github/scripts/patch-041.py,.github/workflows/dev-0.4.1.yml -Force
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '0.4.1: add Service Desk triage clarity'
          git push origin HEAD:feature/0.4.1-triage
