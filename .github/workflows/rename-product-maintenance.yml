name: One-shot product rename

on:
  push:
    branches: ["rename/g-pc-health-check"]

permissions:
  contents: write

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout rename branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: rename/g-pc-health-check
          fetch-depth: 0

      - name: Rename product and repository references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          maintenance = Path('.github/workflows/rename-product-maintenance.yml')

          # Replace legacy brand tokens in every UTF-8 text file. Binary assets are left byte-for-byte unchanged.
          for path in sorted(root.rglob('*')):
              if not path.is_file() or '.git' in path.parts or path == maintenance:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('Gradient', 'G').replace('gradient', 'g')
              if updated != text:
                  path.write_bytes(updated.encode('utf-8'))

          # Rename files/directories themselves, bottom-up so parent moves do not invalidate children.
          paths = [p for p in root.rglob('*') if '.git' not in p.parts and p != maintenance]
          for path in sorted(paths, key=lambda p: len(p.parts), reverse=True):
              if not path.exists():
                  continue
              new_name = path.name.replace('Gradient', 'G').replace('gradient', 'g')
              if new_name != path.name:
                  path.rename(path.with_name(new_name))

          project = Path('src/G.PcHealthCheck/G.PcHealthCheck.csproj')
          text = project.read_text(encoding='utf-8')
          text = text.replace('<Version>0.3.7</Version>', '<Version>0.3.8</Version>')
          text = text.replace('<FileVersion>0.3.7.0</FileVersion>', '<FileVersion>0.3.8.0</FileVersion>')
          text = text.replace('<AssemblyVersion>0.3.7.0</AssemblyVersion>', '<AssemblyVersion>0.3.8.0</AssemblyVersion>')
          project.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8').replace('0.3.7', '0.3.8')
          readme.write_text(text, encoding='utf-8')

          supply = Path('docs/SUPPLY-CHAIN.md')
          text = supply.read_text(encoding='utf-8').replace('0.3.7', '0.3.8')
          supply.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '# Changelog\n\n'
          entry = '''## 0.3.8 — rename to G PC Health Check\n\nBrand-neutral rename baseline before 0.4.0; diagnostic and remediation behavior is unchanged from 0.3.7.\n\n- Product name changed to `G PC Health Check`.\n- Executable renamed to `G-PC-Health-Check.exe`.\n- .NET namespace/project path changed from the legacy brand to `G.PcHealthCheck` / `src/G.PcHealthCheck`.\n- Canonical privileged path changed to `%ProgramFiles%\\G\\PCHealthCheck\\G-PC-Health-Check.exe`.\n- Local report/evidence paths, named-pipe prefix, CI artifacts, pilot bundles, Release assets, SBOM metadata and repository URLs now use `G` / `g`.\n- Current repository name is expected to be `g-pc-health-check`.\n- No runtime diagnostic/remediation logic change.\n- Application version: `0.3.8`.\n\n'''
          if text.startswith(heading):
              text = heading + entry + text[len(heading):]
          else:
              text = entry + text
          changelog.write_text(text, encoding='utf-8')
          PY

          if git grep -n -i 'gradient' -- . ':(exclude).github/workflows/rename-product-maintenance.yml'; then
            echo 'Legacy brand token remains in tracked content.' >&2
            exit 1
          fi
          if find . -path './.git' -prune -o -iname '*gradient*' -print | grep -q .; then
            echo 'Legacy brand token remains in a path.' >&2
            find . -path './.git' -prune -o -iname '*gradient*' -print
            exit 1
          fi

          test -f src/G.PcHealthCheck/G.PcHealthCheck.csproj
          grep -q '<Version>0.3.8</Version>' src/G.PcHealthCheck/G.PcHealthCheck.csproj
          grep -q '<AssemblyName>G-PC-Health-Check</AssemblyName>' src/G.PcHealthCheck/G.PcHealthCheck.csproj
          grep -q '<RootNamespace>G.PcHealthCheck</RootNamespace>' src/G.PcHealthCheck/G.PcHealthCheck.csproj
          grep -q '<Product>G PC Health Check</Product>' src/G.PcHealthCheck/G.PcHealthCheck.csproj

      - name: Commit rename baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'rename: G PC Health Check 0.3.8'
          git push origin HEAD:rename/g-pc-health-check
