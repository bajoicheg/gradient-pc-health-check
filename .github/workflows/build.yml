name: Windows EXE

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pc-health-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: E2E PowerShell tools smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem tools/e2e -Filter *.ps1 -File
          if ($scripts.Count -lt 4) { throw "Expected at least 4 E2E PowerShell tools, found $($scripts.Count)." }

          foreach ($script in $scripts) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
            if (@($parseErrors).Count -gt 0) {
              $details = @($parseErrors) | ForEach-Object { "$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)" }
              throw "PowerShell parse errors in $($script.Name): $($details -join ' | ')"
            }
          }
          Write-Host "PowerShell parser gate passed for $($scripts.Count) scripts."

          try {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -File .\tools\e2e\Prepare-CleanTempScenario.ps1
            if ($LASTEXITCODE -ne 0) { throw "Prepare-CleanTempScenario failed with exit code $LASTEXITCODE" }

            $root = Join-Path $env:TEMP 'GradientPcHealthCheck-E2E'
            $old = Join-Path $root 'old-delete-me.txt'
            $fresh = Join-Path $root 'fresh-must-stay.txt'
            $manifest = Join-Path $root 'e2e-manifest.json'
            if (-not (Test-Path $old) -or -not (Test-Path $fresh) -or -not (Test-Path $manifest)) {
              throw 'Prepare scenario did not create all required sentinels/manifest.'
            }

            # Simulate only the observable effect of successful CleanTemp on our dedicated old sentinel.
            # The real application's remediation is deliberately not invoked against the shared runner Temp.
            Remove-Item -LiteralPath $old -Force
            & powershell.exe -NoLogo -NoProfile -NonInteractive -File .\tools\e2e\Verify-CleanTempScenario.ps1
            if ($LASTEXITCODE -ne 0) { throw "Verify-CleanTempScenario failed with exit code $LASTEXITCODE" }

            $evidenceOut = Join-Path $env:RUNNER_TEMP 'gpchc-e2e-evidence'
            New-Item -ItemType Directory -Force -Path $evidenceOut | Out-Null
            & powershell.exe -NoLogo -NoProfile -NonInteractive -File .\tools\e2e\Collect-E2EEvidence.ps1 -OutputDirectory $evidenceOut -LatestReportFiles 2
            if ($LASTEXITCODE -ne 0) { throw "Collect-E2EEvidence failed with exit code $LASTEXITCODE" }
            $zip = Get-ChildItem $evidenceOut -Filter 'Gradient-PC-Health-Check-E2E-*.zip' -File | Select-Object -First 1
            if ($null -eq $zip -or $zip.Length -le 0) { throw 'Evidence collector did not create a non-empty ZIP.' }
          }
          finally {
            & powershell.exe -NoLogo -NoProfile -NonInteractive -File .\tools\e2e\Cleanup-E2EScenario.ps1
            if ($LASTEXITCODE -ne 0) { throw "Cleanup-E2EScenario failed with exit code $LASTEXITCODE" }
            if (Test-Path (Join-Path $env:TEMP 'GradientPcHealthCheck-E2E')) { throw 'E2E Temp root remains after cleanup.' }
          }

          Write-Host 'E2E PowerShell tools smoke passed.'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore
        run: dotnet restore src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj

      - name: NuGet vulnerability gate
        shell: pwsh
        run: |
          $output = dotnet list src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw "NuGet vulnerability audit command failed with exit code $LASTEXITCODE" }
          $audit = ($output -join "`n") | ConvertFrom-Json
          $vulnerable = @()
          foreach ($project in @($audit.projects)) {
            foreach ($framework in @($project.frameworks)) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($null -ne $package -and @($package.vulnerabilities).Count -gt 0) {
                  $vulnerable += $package
                }
              }
            }
          }
          if ($vulnerable.Count -gt 0) {
            $names = $vulnerable | ForEach-Object { "$($_.id) $($_.resolvedVersion)" }
            throw "Vulnerable NuGet packages detected: $($names -join ', ')"
          }
          Write-Host "NuGet vulnerability gate: no known vulnerable packages."

      - name: Build
        run: dotnet build src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj -c Release --no-restore -warnaserror

      - name: Source-build self-test
        shell: pwsh
        run: |
          dotnet run --project src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj -c Release --no-build -- --selftest
          if ($LASTEXITCODE -ne 0) { throw "Source-build self-test failed with exit code $LASTEXITCODE" }

      - name: Publish single EXE
        run: dotnet publish src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj -c Release -r win-x64 --self-contained true --no-restore -o artifacts/publish

      - name: Published EXE self-test
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/publish/Gradient-PC-Health-Check.exe).Path
          $process = Start-Process -FilePath $exe -ArgumentList @('--selftest') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Published single-file EXE self-test failed with exit code $($process.ExitCode)" }
          Write-Host "Published single-file EXE self-test passed."

      - name: Published worker security negative tests
        shell: pwsh
        run: |
          $exe = (Resolve-Path artifacts/publish/Gradient-PC-Health-Check.exe).Path
          $session = [guid]::NewGuid().ToString('D')
          $pipe = "GradientPcHealthCheck-$session"
          $nonce = 'A' * 64

          $p = Start-Process -FilePath $exe -ArgumentList @('--worker','--session',$session,'--actions','DefinitelyNotAllowed','--temp-days','3','--pipe',$pipe,'--nonce',$nonce) -Wait -PassThru
          if ($p.ExitCode -ne 21) { throw "Unknown action was not rejected as expected. Exit code: $($p.ExitCode)" }

          $p = Start-Process -FilePath $exe -ArgumentList @('--worker','--session',$session,'--actions','FlushDns','--temp-days','3','--pipe','invalid-pipe-name','--nonce',$nonce) -Wait -PassThru
          if ($p.ExitCode -ne 24) { throw "Invalid pipe name was not rejected as expected. Exit code: $($p.ExitCode)" }

          $p = Start-Process -FilePath $exe -ArgumentList @('--worker','--session',$session,'--actions','FlushDns','--temp-days','3','--pipe',$pipe,'--nonce','bad-nonce') -Wait -PassThru
          if ($p.ExitCode -ne 25) { throw "Invalid nonce was not rejected as expected. Exit code: $($p.ExitCode)" }

          Write-Host "Published worker negative security tests passed."

      - name: Verify package, version and checksum
        shell: pwsh
        run: |
          $exe = Get-Item artifacts/publish/Gradient-PC-Health-Check.exe -ErrorAction Stop
          $unexpected = Get-ChildItem artifacts/publish -File | Where-Object Name -ne 'Gradient-PC-Health-Check.exe'
          if ($unexpected) { throw "Single-file gate failed: $($unexpected.Name -join ', ')" }

          [xml]$project = Get-Content src/Gradient.PcHealthCheck/Gradient.PcHealthCheck.csproj
          $expectedVersion = [string]$project.Project.PropertyGroup.Version
          $actualFileVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileVersion
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) { throw 'Project Version is empty.' }
          if (-not $actualFileVersion.StartsWith($expectedVersion, [StringComparison]::Ordinal)) {
            throw "File version mismatch. Project=$expectedVersion EXE=$actualFileVersion"
          }

          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Force artifacts/final | Out-Null
          Copy-Item $exe.FullName artifacts/final/Gradient-PC-Health-Check.exe
          Set-Content artifacts/final/Gradient-PC-Health-Check.exe.sha256 "$hash  Gradient-PC-Health-Check.exe" -Encoding ascii
          Write-Host "Version: $actualFileVersion"
          Write-Host "SHA-256: $hash"

      - name: Upload EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradient-pc-health-check-windows-x64
          path: artifacts/final/*
          if-no-files-found: error
          retention-days: 30
